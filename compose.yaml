services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nextagent
      POSTGRES_PASSWORD: nextagent
      POSTGRES_DB: nextagent
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextagent -d nextagent"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
