name: 问题反馈
description: 报告可复现的页面、本机保存或图片下载问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: 请使用示例数据复现，不要提交真实用户的本机记录、密码或其他私密信息。
  - type: input
    id: version
    attributes:
      label: 应用或内容版本
      description: 写明分支、提交或页面中可见的版本；不知道时写“未知”。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 如何复现
      description: 说明从哪个页面开始、输入或点击了什么。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际行为
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 浏览器、设备，以及 GitHub Pages 网站或本地静态预览。
  - type: textarea
    id: details
    attributes:
      label: 补充信息
      description: 可附使用示例数据得到的截图或错误信息。
