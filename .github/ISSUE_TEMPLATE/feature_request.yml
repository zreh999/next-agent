name: 功能建议
description: 描述想解决的具体使用问题
title: "[Feature] "
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 谁在什么情况下遇到什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的行为
      description: 描述使用者会看到或完成什么。
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 完成标准
      description: 怎样判断功能已经解决了这个问题？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 当前做法与其他选择
      description: 说明现有流程为何不足，以及是否可以用更小的改动解决。
